{% extends "base.html" %}

{% block content %}
<div>
  <h1>{{ title }}</h1>
  <p class="muted">in <a href="{{ project.get_absolute_url }}" class="link">{{ project.name }}</a></p>
</div>

<form method="post" class="panel form narrow">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label>
    Title
    {{ form.title }}
    {{ form.title.errors }}
  </label>
  <label>
    Description <span class="muted">(optional)</span>
    {{ form.description }}
    {{ form.description.errors }}
  </label>
  <label>
    Status
    {{ form.status }}
    {{ form.status.errors }}
  </label>
  <label>
    Assignee
    {{ form.assignee }}
    {{ form.assignee.errors }}
  </label>
  <label>
    Due date <span class="muted">(optional)</span>
    {{ form.due_date }}
    {{ form.due_date.errors }}
  </label>
  <button type="submit" class="button">{{ submit_label }}</button>
</form>
{% endblock %}
